<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- House shape -->
  <path d="M50 10 L85 40 L85 85 L15 85 L15 40 Z" fill="#007AFF" stroke="#005BBB" stroke-width="2"/>

